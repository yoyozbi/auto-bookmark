name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.actor }}/auto-bookmarks

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose --features ssr

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --force

      - name: Run tests
        run: |
          cargo nextest run --verbose --features ssr --profile ci

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🦀 Rust Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 Default features tests completed" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 SSR features tests completed" >> $GITHUB_STEP_SUMMARY
          echo "- 📚 Documentation tests completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Rust version:** $(rustc --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **Cargo version:** $(cargo --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **Test runner:** cargo-nextest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Workflow Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some checks failed. Please review the logs above.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            target/nextest/ci/junit.xml
          retention-days: 30

  docker-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [rust-test]
    if: ${{ github.head_ref || github.ref_name }} != "main"
    permissions:
      packages: read
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-ci
            type=ref,event=pr,suffix=-ci
            type=sha,prefix=ci-

      - name: Build Docker image (test only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: |
            type=gha,scope=ci-${{ github.ref_name }}
            type=gha,scope=ci-main
          cache-to: type=gha,scope=ci-${{ github.ref_name }},mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Generate Docker test summary
        if: always()
        run: |
          echo "## 🐳 Docker Build Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** linux/amd64 (test build)" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache Strategy:** GitHub Actions Cache" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Docker build test passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Docker build test failed. Please review the logs above.**" >> $GITHUB_STEP_SUMMARY
          fi

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [rust-test, docker-test]
    if: always()
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.rust-test.result }}" == "success" ] && [ "${{ needs.docker-test.result }}" == "success" ]; then
            echo "✅ All tests passed successfully!"
            exit 0
          else
            echo "❌ Tests failed or were cancelled"
            echo "Rust tests: ${{ needs.rust-test.result }}"
            echo "Docker tests: ${{ needs.docker-test.result }}"
            exit 1
          fi
