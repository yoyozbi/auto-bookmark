name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.actor }}/auto-bookmarks

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose --features ssr

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --force

      - name: Run tests
        run: |
          cargo nextest run --verbose --features ssr --profile ci

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🦀 Rust Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 Default features tests completed" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 SSR features tests completed" >> $GITHUB_STEP_SUMMARY
          echo "- 📚 Documentation tests completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Rust version:** $(rustc --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **Cargo version:** $(cargo --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **Test runner:** cargo-nextest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Workflow Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some checks failed. Please review the logs above.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            target/nextest/ci/junit.xml
          retention-days: 30

      - name: Test Reporter
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Cargo test results
          path: target/nexttest/ci/junit.xml
          reporter: java-junit
