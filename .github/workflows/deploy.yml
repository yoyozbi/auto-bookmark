name: Build and Deploy Docker Image

on:
  release:
    types: [published]
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.actor }}/auto-bookmarks

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build-rust:
    name: Build Rust Binaries
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-musl
            arch: amd64
          - platform: linux/arm64
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Install Node.js for sass
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install sass and cargo-leptos
        run: |
          npm install -g sass
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/leptos-rs/cargo-leptos/releases/download/v0.2.42/cargo-leptos-installer.sh | sh

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Build server binary
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target=${{ matrix.target }} --features ssr --bin auto-bookmark

      - name: Build WASM and site (only for amd64)
        if: matrix.arch == 'amd64'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo leptos build --release

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: auto-bookmark-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/auto-bookmark

      - name: Upload site assets (only for amd64)
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: leptos-site
          path: target/site/

  build-and-deploy:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-rust
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Organize build artifacts
        run: |
          mkdir -p ./dist/linux/amd64
          mkdir -p ./dist/linux/arm64
          mkdir -p ./dist/site

          # Copy binaries
          cp ./artifacts/auto-bookmark-amd64/auto-bookmark ./dist/linux/amd64/
          cp ./artifacts/auto-bookmark-arm64/auto-bookmark ./dist/linux/arm64/

          # Copy site assets (preserve directory structure and file integrity)
          if [ -d "./artifacts/leptos-site" ]; then
            cp -r ./artifacts/leptos-site/. ./dist/site/
          fi

          # Make binaries executable
          chmod +x ./dist/linux/amd64/auto-bookmark
          chmod +x ./dist/linux/arm64/auto-bookmark

          # Verify WASM files exist and are not corrupted
          echo "Checking for WASM files:"
          find ./dist/site -name "*.wasm" -type f -exec ls -la {} \;
          find ./dist/site -name "*.wasm" -type f -exec file {} \;

          ls -la ./dist/linux/*/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=gha,scope=${{ github.ref_name }}-docker
            type=gha,scope=main-docker
          cache-to: type=gha,scope=${{ github.ref_name }}-docker,mode=max

      - name: Generate build summary
        if: always()
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache Strategy:** GitHub Actions Cache" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags Generated" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "✅ **Build completed successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "- **Image Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build failed. Please check the logs above.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
